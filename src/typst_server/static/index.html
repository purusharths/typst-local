<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Typst</title>
<link rel="stylesheet" href="style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22><rect width=%2232%22 height=%2232%22 rx=%226%22 fill=%22%23239dad%22/><text x=%2216%22 y=%2223%22 font-size=%2220%22 font-family=%22serif%22 font-weight=%22bold%22 text-anchor=%22middle%22 fill=%22white%22>t</text></svg>">
<script>try{document.documentElement.dataset.theme=localStorage.getItem("theme")||"light"}catch(e){}</script>
</head>
<body>

<!-- ===== Landing: project list ===== -->
<div id="home" hidden>
  <header class="home-head">
    <h1><span class="brand">typst</span> projects</h1>
    <span class="spacer"></span>
    <button id="home-new" class="primary">+ New project</button>
    <button class="theme-toggle" title="Toggle theme">◐</button>
  </header>
  <div id="cards" class="cards"></div>
  <p id="home-empty" class="muted" hidden>No projects yet. Create one to get started.</p>
  <p class="muted small">Files live in <code id="root-path">~/Documents/typst-files/&lt;project&gt;/</code></p>
</div>

<!-- ===== Editor ===== -->
<div id="app" hidden>
  <aside id="sidebar">
    <div class="side-head">
      <a href="#" class="back" title="All projects">← projects</a>
      <button class="theme-toggle" title="Toggle theme">◐</button>
    </div>
    <div class="proj-row">
      <div id="proj-name" class="proj-name"></div>
      <button id="reveal" title="Open project folder in file manager">📁</button>
    </div>
    <div id="proj-path" class="proj-path" title="Click to copy path"></div>
    <div class="side-head files-head">
      <span>Files</span>
      <span>
        <button id="new-file" title="New file">+</button>
        <button id="upload-btn" title="Upload files">⇧</button>
        <input id="upload" type="file" multiple hidden>
      </span>
    </div>
    <ul id="files"></ul>
  </aside>

  <main id="editor-pane">
    <div class="bar">
      <span id="cur-file" class="path">—</span>
      <span class="spacer"></span>
      <span id="status" class="status"></span>
      <button id="toggle-preview" title="Show / hide PDF preview for this file">hide pdf</button>
    </div>
    <div id="editor"></div>
  </main>

  <div id="gutter"></div>

  <section id="preview-pane">
    <div class="bar">
      <span id="page-info"></span>
      <span class="spacer"></span>
      <button id="zoom-out" title="Zoom out">−</button>
      <span id="zoom-val">100%</span>
      <button id="zoom-in" title="Zoom in">+</button>
      <button id="zoom-fit" title="Fit width">fit</button>
      <a id="pdf" class="btn" target="_blank" title="Open PDF in a new tab">PDF</a>
      <a id="pdf-dl" class="btn" title="Download PDF">⬇</a>
    </div>
    <div id="preview"></div>
    <pre id="errors" hidden></pre>
  </section>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
